[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gesture-reactions"
version = "0.2.0"
description = "macOS FaceTime-style gesture reactions for Windows video calls with MediaPipe and PyVirtualCam"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Sai Hardhik Reddy", email = "saihardhikreddy@gmail.com" }
]
dependencies = [
    "mediapipe>=0.10.30",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "pillow>=10.0",
    "pyvirtualcam>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
